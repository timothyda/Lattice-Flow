appId: com.latticeflow
productName: Lattice Flow
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
win:
  executableName: lattice-flow
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
  category: Utility
